<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edinburgh University Boat Club</title>
<meta name="description" content="Edinburgh University Boat Club — official home page.">
<link rel="preload" href="assets/fonts/Aileron-Light.woff2" as="font" type="font/woff2">
<link rel="preload" href="assets/fonts/Aileron-Regular.woff2" as="font" type="font/woff2">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/buttons.css">
</head>
<body>

<header class="hero">

  <!-- Loading/play control lives in js/video-loader.js (connection + reduced-motion aware). -->
  <div class="hero__video-wrap">
    <video
      class="hero__video"
      id="heroVideo"
      poster="assets/images/hero-poster.jpg"
      muted
      loop
      playsinline
      preload="none"
      aria-hidden="true"
    >
      <source src="assets/video/mobile-av1.webm" type='video/webm; codecs="av01.0.05M.08"' media="(max-width: 760px)">
      <source src="assets/video/mobile-h264.mp4" type="video/mp4" media="(max-width: 760px)">
      <source src="assets/video/desktop-av1.webm" type='video/webm; codecs="av01.0.08M.08"'>
      <source src="assets/video/desktop-h264.mp4" type="video/mp4">
    </video>
    <img
      class="hero__fallback-image"
      src="assets/images/hero-poster.jpg"
      alt=""
      aria-hidden="true"
    >
  </div>

  <div class="hero__overlay"></div>

  <img class="hero__crest" src="assets/images/eubc-logo.png" alt="Edinburgh University Boat Club crest" width="636" height="900" loading="eager" fetchpriority="high">

  <div class="hero__content">
    <h1 class="hero__title">
      <span>Edinburgh University</span>
      <span>Boat Club</span>
    </h1>

    <nav class="hero__nav glass-nav" aria-label="Primary">
      <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
        <defs>
          <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="2" seed="7" result="noise"></feTurbulence>
            <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"></feGaussianBlur>
            <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="22" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
          </filter>
        </defs>
      </svg>
      <a href="#about" class="glass-button">About us</a>
      <a href="#join" class="glass-button">Join Us</a>
      <a href="#news" class="glass-button">News</a>
      <a href="#alumni" class="glass-button">Alumni and Supports</a>
    </nav>
  </div>

</header>

<script src="js/video-loader.js" defer></script>
<script src="js/buttons.js" defer></script>
</body>
</html>
